spring.application.name=atenas-api

# Puerto del servidor. Desde el emulador de Android se llega con http://10.0.2.2:8080
server.port=8080

# Base de datos H2 guardada en el archivo ./data/atenasdb (los datos sobreviven al reiniciar)
spring.datasource.url=jdbc:h2:file:./data/atenasdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 para ver las tablas: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/atenasdb  usuario: sa  contrasena: vacia)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Muestra en consola el SQL que ejecuta Hibernate (util para explicar el flujo)
spring.jpa.show-sql=true
